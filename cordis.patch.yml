# dsh-vscode-ssh-open bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile web add <this-package>` or `add link:<checkout>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process as a no-op carrier, and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: vscode-ssh-open
      name: '@shugen002/dsh-vscode-ssh-open'
